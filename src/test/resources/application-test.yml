# Test configuration for integration tests
# src/test/resources/application-test.yml

server:
  port: 0 # Use random port for tests

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true

logging:
  level:
    org.springframework.security: INFO
    com.wpanther: DEBUG
    org.hibernate.SQL: DEBUG

# Use a temporary directory for keystores during testing
app:
  csc:
    base-url: http://localhost:9000
    logo-url: http://localhost:9000/logo.png
  keystore:
    base-path: ${java.io.tmpdir}/test-keystores
  pkcs11:
    enabled: false
  # DSS trust store — required for SignDocLtltaIT (LT/LTA needs the dev-PKI root CA
  # trusted so DSS will chase revocation via AIA). The default path+password match
  # dev-pki/generate.sh outputs (DEV_PKI_TRUSTSTORE_PASSWORD defaults to "changeit").
  # B/T tests are unaffected — they don't exercise chain validation.
  dss:
    truststore:
      path: ${DSS_TRUSTSTORE_PATH:dev-pki/out/truststore/dss-truststore.bcfks}
      type: BCFKS
      password: ${DSS_TRUSTSTORE_PASSWORD:changeit}
