# Dev PKI serving stack. Certificates bake in localhost:8880-8882 — these
# ports are contract; changing them requires regenerating the PKI.
# OCSP responses are signed with the CA keys themselves (dev-only shortcut).
services:
  pki-web:
    image: nginx:alpine
    ports:
      - "8880:80"
    volumes:
      - ./out/www:/usr/share/nginx/html:ro
    restart: unless-stopped

  # NOTE: no '-multi': its worker busy-loops under this PID-namespace setup
  # (measured ~100% CPU per responder, sustained while idle; 0% without it).
  # Single-process mode blocks in accept() and is fine for a dev responder —
  # DSS falls back to CRL if it's ever busy. Dropping -multi also removes the
  # setsid()-fails-for-PID-1 problem the previous sh-wrapper worked around.
  # 'init: true' puts tini at PID 1 so SIGTERM reaches openssl (otherwise
  # 'docker compose stop/restart' waits out the 10s SIGKILL timeout).
  # 'apk add' runs on every container start: first 'up' needs network access.
  ocsp-root:
    image: alpine:3.20
    init: true
    entrypoint: ["sh", "-c", "apk add --no-cache openssl >/dev/null && exec openssl \"$@\"", "--"]
    command: >-
      ocsp -port 8881 -index /ca/index.txt -CA /ca/root.crt
      -rkey /ca/private/root.key -rsigner /ca/root.crt -nmin 5
    ports:
      - "8881:8881"
    volumes:
      - ./out/ca/root:/ca:ro
    restart: unless-stopped

  ocsp-issuing:
    image: alpine:3.20
    init: true
    entrypoint: ["sh", "-c", "apk add --no-cache openssl >/dev/null && exec openssl \"$@\"", "--"]
    command: >-
      ocsp -port 8882 -index /ca/index.txt -CA /ca/issuing.crt
      -rkey /ca/private/issuing.key -rsigner /ca/issuing.crt -nmin 5
    ports:
      - "8882:8882"
    volumes:
      - ./out/ca/issuing:/ca:ro
    restart: unless-stopped
